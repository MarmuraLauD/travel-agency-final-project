<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{app.title} + ' | ' + #{auth.signin.title}">Travel Agency | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .auth-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
        }
        .auth-header {
            font-size: 1.75rem;
            font-weight: 300;
            color: #2d3748;
        }
        .form-control {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            transition: all 0.2s;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .btn-signin {
            background: #667eea;
            border: none;
            border-radius: 8px;
            padding: 0.75rem;
            font-weight: 500;
            transition: all 0.2s;
        }
        .btn-signin:hover {
            background: #5a67d8;
            transform: translateY(-1px);
        }
        .form-label {
            font-weight: 500;
            color: #4a5568;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: header}"></div>

<div class="container mt-5 pt-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="auth-card shadow-lg p-5">
                <h2 class="auth-header text-center mb-4" th:text="#{auth.signin.title}">Sign In</h2>
                <form id="loginForm" novalidate>
                    <div class="mb-3">
                        <label class="form-label" th:text="#{auth.username}">Username</label>
                        <input type="text" class="form-control" id="username"
                               th:placeholder="#{auth.username}" required minlength="3" maxlength="20">
                        <div class="invalid-feedback" th:text="#{validation.username.size}">Enter username (3-20 characters)</div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label" th:text="#{auth.password}">Password</label>
                        <input type="password" class="form-control" id="password"
                               th:placeholder="#{auth.password}" required minlength="6">
                        <div class="invalid-feedback" th:text="#{validation.password.size}">Enter password (at least 6 characters)</div>
                    </div>
                    <div id="error-message" class="alert alert-danger d-none"></div>
                    <button type="submit" class="btn btn-signin text-white w-100" th:text="#{auth.signin.button}">Sign In</button>
                </form>
                <div class="text-center mt-4">
                    <span class="text-muted small" th:text="#{auth.no.account}">Don't have an account?</span>
                    <a th:href="@{/register}" class="text-decoration-none small fw-semibold ms-1" style="color: #667eea;" th:text="#{auth.signup.button}">Sign Up</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const form = document.getElementById('loginForm');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const errorDiv = document.getElementById('error-message');

    function validateField(input) {
        if (input.validity.valid) {
            input.classList.remove('is-invalid');
            input.classList.add('is-valid');
            return true;
        } else {
            input.classList.remove('is-valid');
            input.classList.add('is-invalid');
            return false;
        }
    }

    usernameInput.addEventListener('blur', () => validateField(usernameInput));
    passwordInput.addEventListener('blur', () => validateField(passwordInput));

    usernameInput.addEventListener('input', () => {
        if (usernameInput.classList.contains('is-invalid')) validateField(usernameInput);
    });
    passwordInput.addEventListener('input', () => {
        if (passwordInput.classList.contains('is-invalid')) validateField(passwordInput);
    });

    form.addEventListener('submit', function(e) {
        e.preventDefault();

        const isUsernameValid = validateField(usernameInput);
        const isPasswordValid = validateField(passwordInput);

        if (!isUsernameValid || !isPasswordValid) {
            return;
        }

        const user = usernameInput.value;
        const pass = passwordInput.value;

        errorDiv.classList.add('d-none');

        fetch('/api/auth/signin', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: user, password: pass })
        })
            .then(async response => {
                if (response.ok) {
                    window.location.href = '/dashboard';
                } else {
                    const data = await response.json().catch(() => ({}));
                    errorDiv.innerText = data.message || 'Invalid username or password!';
                    errorDiv.classList.remove('d-none');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                errorDiv.innerText = 'Server connection error. Please try again later.';
                errorDiv.classList.remove('d-none');
            });
    });
</script>
</body>
</html>
