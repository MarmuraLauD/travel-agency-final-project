<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="#{error.generic.title}">Error</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .error-container {
      text-align: center;
      padding: 3rem;
    }
    .error-card {
      background: white;
      border-radius: 24px;
      padding: 4rem 3rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
      max-width: 600px;
    }
    .error-code {
      font-size: 6rem;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 1rem;
    }
    .error-title {
      font-size: 2rem;
      font-weight: 600;
      color: #2d3748;
      margin-bottom: 1rem;
    }
    .error-description {
      color: #718096;
      font-size: 1.1rem;
      margin-bottom: 2.5rem;
      line-height: 1.6;
    }
    .error-message {
      background: #f7fafc;
      border-left: 4px solid #667eea;
      padding: 1rem 1.5rem;
      border-radius: 8px;
      margin-bottom: 2rem;
      text-align: left;
    }
    .error-message-text {
      color: #4a5568;
      margin: 0;
      font-size: 0.95rem;
    }
    .btn-home {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      color: white;
      padding: 0.875rem 2.5rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.3s;
      text-decoration: none;
      display: inline-block;
    }
    .btn-home:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
      color: white;
    }
    .error-icon {
      font-size: 5rem;
      color: #667eea;
      margin-bottom: 1.5rem;
      opacity: 0.8;
    }
  </style>
</head>
<body>
<div class="error-container">
  <div class="error-card">
    <i class="bi bi-exclamation-circle error-icon"></i>
    <div class="error-code" th:text="${status} ?: #{error.generic.status}">Error</div>
    <h1 class="error-title" th:text="${error} ?: #{error.generic.occurred}">Something gone wrong</h1>

    <div class="error-message" th:if="${message}">
      <p class="error-message-text" th:text="${message}">Error message</p>
    </div>

    <p class="error-description" th:text="#{error.generic.description}">
      We apologize for the inconvenience. Please try returning to the home page.
    </p>

    <a href="/" class="btn-home">
      <i class="bi bi-house-door me-2"></i><span th:text="#{error.back.home}">Home</span>
    </a>
  </div>
</div>
</body>
</html>
