<div xmlns:th="http://www.thymeleaf.org" th:fragment="vouchers">
    <div class="admin-card">
        <div class="p-3">
            <div class="row mb-3">
                <div class="col-md-12">
                    <div class="input-group">
                        <span class="input-group-text" style="background: white; border-right: none;">
                            <i class="bi bi-search text-muted"></i>
                        </span>
                        <input type="text" id="voucher-search" class="form-control" th:placeholder="#{filter.search.title}" placeholder="Search by title..." style="border-left: none; border-radius: 0 8px 8px 0;">
                    </div>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-3">
                    <select id="voucher-status-filter" class="form-select" style="border-radius: 8px;">
                        <option value="ALL" th:text="#{filter.all.statuses}">All Statuses</option>
                        <option value="REGISTERED" th:text="#{enum.status.registered}">Registered</option>
                        <option value="PENDING" th:text="#{enum.status.pending}">Pending</option>
                        <option value="CONFIRMED" th:text="#{enum.status.confirmed}">Confirmed</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select id="voucher-tourtype-filter" class="form-select" style="border-radius: 8px;">
                        <option value="ALL" th:text="#{filter.tour.type}">All Tour Types</option>
                        <option value="HEALTH" th:text="#{enum.tour.health}">Health</option>
                        <option value="SPORTS" th:text="#{enum.tour.sports}">Sports</option>
                        <option value="LEISURE" th:text="#{enum.tour.leisure}">Leisure</option>
                        <option value="SAFARI" th:text="#{enum.tour.safari}">Safari</option>
                        <option value="WINE" th:text="#{enum.tour.wine}">Wine</option>
                        <option value="ECO" th:text="#{enum.tour.eco}">Eco</option>
                        <option value="ADVENTURE" th:text="#{enum.tour.adventure}">Adventure</option>
                        <option value="CULTURAL" th:text="#{enum.tour.cultural}">Cultural</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select id="voucher-transfer-filter" class="form-select" style="border-radius: 8px;">
                        <option value="ALL" th:text="#{filter.transfer.type}">All Transfer Types</option>
                        <option value="BUS" th:text="#{enum.trans.bus}">Bus</option>
                        <option value="TRAIN" th:text="#{enum.trans.train}">Train</option>
                        <option value="PLANE" th:text="#{enum.trans.plane}">Plane</option>
                        <option value="SHIP" th:text="#{enum.trans.ship}">Ship</option>
                        <option value="PRIVATE_CAR" th:text="#{enum.trans.private}">Private Car</option>
                        <option value="JEEPS" th:text="#{enum.trans.jeeps}">Jeeps</option>
                        <option value="MINIBUS" th:text="#{enum.trans.minibus}">Minibus</option>
                        <option value="ELECTRICAL_CARS" th:text="#{enum.trans.electric}">Electrical Cars</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select id="voucher-hotel-filter" class="form-select" style="border-radius: 8px;">
                        <option value="ALL" th:text="#{filter.hotel.type}">All Hotel Types</option>
                        <option value="ONE_STAR" th:text="#{enum.hotel.1star}">⭐ 1 Star</option>
                        <option value="TWO_STARS" th:text="#{enum.hotel.2star}">⭐⭐ 2 Stars</option>
                        <option value="THREE_STARS" th:text="#{enum.hotel.3star}">⭐⭐⭐ 3 Stars</option>
                        <option value="FOUR_STARS" th:text="#{enum.hotel.4star}">⭐⭐⭐⭐ 4 Stars</option>
                        <option value="FIVE_STARS" th:text="#{enum.hotel.5star}">⭐⭐⭐⭐⭐ 5 Stars</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead style="background: #f8f9fa; border-bottom: 2px solid #e2e8f0;">
                <tr>
                    <th class="sort-header" onclick="sortVouchers('title')" style="color: #2d3748; font-weight: 600; cursor: pointer;" th:text="#{table.title}">
                        Title <i class="bi bi-arrow-down-up ms-1"></i>
                    </th>
                    <th class="sort-header" onclick="sortVouchers('tourType')" style="color: #2d3748; font-weight: 600; cursor: pointer;" th:text="#{table.type}">
                        Type <i class="bi bi-arrow-down-up ms-1"></i>
                    </th>
                    <th class="sort-header" onclick="sortVouchers('transferType')" style="color: #2d3748; font-weight: 600; cursor: pointer;" th:text="#{table.transfer}">
                        Transfer <i class="bi bi-arrow-down-up ms-1"></i>
                    </th>
                    <th class="sort-header" onclick="sortVouchers('hotelType')" style="color: #2d3748; font-weight: 600; cursor: pointer;" th:text="#{table.hotel}">
                        Hotel <i class="bi bi-arrow-down-up ms-1"></i>
                    </th>
                    <th class="sort-header" onclick="sortVouchers('price')" style="color: #2d3748; font-weight: 600; cursor: pointer;" th:text="#{table.price}">
                        Price <i class="bi bi-arrow-down-up ms-1"></i>
                    </th>
                    <th class="sort-header" onclick="sortVouchers('status')" style="color: #2d3748; font-weight: 600; cursor: pointer;" th:text="#{table.status}">
                        Status <i class="bi bi-arrow-down-up ms-1"></i>
                    </th>
                    <th style="color: #2d3748; font-weight: 600;" th:text="#{table.actions}">Actions</th>
                </tr>
                </thead>
                <tbody id="admin-vouchers-list"></tbody>
            </table>
        </div>
        <div class="p-3 d-flex justify-content-between align-items-center" id="voucher-pagination-container">
            <div>
                <span class="text-muted">Showing <span id="voucher-page-info">0</span></span>
            </div>
            <nav>
                <ul class="pagination mb-0" id="voucher-pagination"></ul>
            </nav>
        </div>
    </div>

    <div class="modal fade" id="editVoucherModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content" style="border: none; border-radius: 16px; overflow: hidden;">
                <div class="modal-header" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none;">
                    <h5 class="modal-title">Edit Voucher</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <input type="hidden" id="edit-v-id">
                    <div class="mb-3">
                        <label class="form-label fw-semibold" style="color: #4a5568;">Title</label>
                        <input type="text" id="edit-v-title" class="form-control" style="border-radius: 8px; border: 1px solid #e2e8f0;">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold" style="color: #4a5568;">Description</label>
                        <textarea id="edit-v-desc" class="form-control" style="border-radius: 8px; border: 1px solid #e2e8f0;" rows="3"></textarea>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label fw-semibold" style="color: #4a5568;">Price</label>
                            <input type="number" step="0.01" id="edit-v-price" class="form-control" style="border-radius: 8px; border: 1px solid #e2e8f0;">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold" style="color: #4a5568;">Tour Type</label>
                            <select id="edit-v-tourType" class="form-select" style="border-radius: 8px; border: 1px solid #e2e8f0;">
                                <option value="HEALTH">Health</option>
                                <option value="SPORTS">Sports</option>
                                <option value="LEISURE">Leisure</option>
                                <option value="SAFARI">Safari</option>
                                <option value="WINE">Wine</option>
                                <option value="ECO">Eco</option>
                                <option value="ADVENTURE">Adventure</option>
                                <option value="CULTURAL">Cultural</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-semibold" style="color: #4a5568;">Status</label>
                            <select id="edit-v-status" class="form-select" style="border-radius: 8px; border: 1px solid #e2e8f0;">
                                <option value="REGISTERED">Registered</option>
                                <option value="PENDING">Pending</option>
                                <option value="CONFIRMED">Confirmed</option>
                            </select>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold" style="color: #4a5568;">Transfer Type</label>
                            <select id="edit-v-transfer" class="form-select" style="border-radius: 8px; border: 1px solid #e2e8f0;">
                                <option value="BUS">Bus</option>
                                <option value="TRAIN">Train</option>
                                <option value="PLANE">Plane</option>
                                <option value="SHIP">Ship</option>
                                <option value="PRIVATE_CAR">Private Car</option>
                                <option value="JEEPS">Jeeps</option>
                                <option value="MINIBUS">Minibus</option>
                                <option value="ELECTRICAL_CARS">Electrical Cars</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold" style="color: #4a5568;">Hotel Type</label>
                            <select id="edit-v-hotel" class="form-select" style="border-radius: 8px; border: 1px solid #e2e8f0;">
                                <option value="ONE_STAR">1 Star</option>
                                <option value="TWO_STARS">2 Stars</option>
                                <option value="THREE_STARS">3 Stars</option>
                                <option value="FOUR_STARS">4 Stars</option>
                                <option value="FIVE_STARS">5 Stars</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="modal-footer" style="background: #f8f9fa; border: none;">
                    <button type="button" class="btn" style="background: #667eea; color: white; border: none; border-radius: 8px; padding: 0.5rem 1.5rem;" onclick="saveVoucherChanges()">Save</button>
                </div>
            </div>
        </div>
    </div>
</div>

<div xmlns:th="http://www.thymeleaf.org" th:fragment="create-voucher-form">
    <div class="admin-card p-4">
        <form id="v-form" novalidate>
            <div class="mb-3">
                <label class="form-label fw-semibold" style="color: #4a5568;" th:text="#{table.title}">Title</label>
                <input type="text" id="v-title" class="form-control" style="border-radius: 8px; border: 1px solid #e2e8f0;" required minlength="3" maxlength="100">
                <div class="invalid-feedback" th:text="#{validation.title.size}">Title must be between 3 and 100 characters</div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold" style="color: #4a5568;" th:text="#{table.description}">Description</label>
                <textarea id="v-desc" class="form-control" style="border-radius: 8px; border: 1px solid #e2e8f0;" rows="3" required minlength="10" maxlength="1000"></textarea>
                <div class="invalid-feedback" th:text="#{validation.description.size}">Description must be between 10 and 1000 characters</div>
            </div>
            <div class="row mb-3">
                <div class="col-md-3">
                    <label class="form-label fw-semibold" style="color: #4a5568;" th:text="#{table.price}">Price</label>
                    <input type="number" id="v-price" step="0.01" min="0.01" max="1000000" class="form-control" style="border-radius: 8px; border: 1px solid #e2e8f0;" required>
                    <div class="invalid-feedback" th:text="#{validation.price.invalid}">Price must be between 0.01 and 1,000,000</div>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-semibold" style="color: #4a5568;" th:text="#{table.type}">Type</label>
                    <select id="v-tourType" class="form-select" style="border-radius: 8px; border: 1px solid #e2e8f0;">
                        <option value="HEALTH">Health</option>
                        <option value="SPORTS">Sports</option>
                        <option value="LEISURE">Leisure</option>
                        <option value="SAFARI">Safari</option>
                        <option value="WINE">Wine</option>
                        <option value="ECO">Eco</option>
                        <option value="ADVENTURE">Adventure</option>
                        <option value="CULTURAL">Cultural</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-semibold" style="color: #4a5568;" th:text="#{table.status}">Status</label>
                    <select id="v-status" class="form-select" style="border-radius: 8px; border: 1px solid #e2e8f0;">
                        <option value="REGISTERED">Registered</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-semibold" style="color: #4a5568;" th:text="#{table.hot}">Hot?</label>
                    <select id="v-hot" class="form-select" style="border-radius: 8px; border: 1px solid #e2e8f0;">
                        <option value="false">No</option>
                        <option value="true">Yes</option>
                    </select>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold" style="color: #4a5568;" th:text="#{table.transfer}">Transfer</label>
                    <select id="v-transfer" class="form-select" style="border-radius: 8px; border: 1px solid #e2e8f0;">
                        <option value="BUS">Bus</option>
                        <option value="TRAIN">Train</option>
                        <option value="PLANE">Plane</option>
                        <option value="SHIP">Ship</option>
                        <option value="PRIVATE_CAR">Private Car</option>
                        <option value="JEEPS">Jeeps</option>
                        <option value="MINIBUS">Minibus</option>
                        <option value="ELECTRICAL_CARS">Electrical Cars</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold" style="color: #4a5568;" th:text="#{table.hotel}">Hotel</label>
                    <select id="v-hotel" class="form-select" style="border-radius: 8px; border: 1px solid #e2e8f0;">
                        <option value="ONE_STAR">1 Star</option>
                        <option value="TWO_STARS">2 Stars</option>
                        <option value="THREE_STARS">3 Stars</option>
                        <option value="FOUR_STARS">4 Stars</option>
                        <option value="FIVE_STARS">5 Stars</option>
                    </select>
                </div>
            </div>
            <button type="submit" class="btn w-100" style="background: #667eea; color: white; border: none; border-radius: 8px; padding: 0.75rem; font-weight: 500;" th:text="#{admin.create.voucher}">Create Voucher</button>
        </form>
    </div>
</div>
