<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Travel Agency | Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .sort-header { cursor: pointer; user-select: none; }
        .sort-header:hover { background-color: rgba(0,0,0,0.05); }
        .nav-link.text-success { font-weight: bold; }
    </style>
</head>
<body class="bg-light"
      th:data-can-delete-v="${#authorization.expression('hasAuthority(''voucher:delete'')')}"
      th:data-can-delete-u="${#authorization.expression('hasAuthority(''user:delete'')')}">

<div th:replace="fragments/navbar :: header"></div>

<div class="container mt-5">
    <ul class="nav nav-pills mb-4" id="adminTabs" role="tablist">
        <li class="nav-item">
            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-manage-v">Vouchers</button>
        </li>
        <li class="nav-item">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-manage-u">Users</button>
        </li>
        <li class="nav-item" sec:authorize="hasAuthority('voucher:create')">
            <button class="nav-link text-success" data-bs-toggle="tab" data-bs-target="#tab-create-v">New Voucher</button>
        </li>
        <li class="nav-item" sec:authorize="hasAuthority('user:create')">
            <button class="nav-link text-success" data-bs-toggle="tab" data-bs-target="#tab-create-u">New User</button>
        </li>
    </ul>

    <div class="tab-content">
        <div class="tab-pane fade show active" id="tab-manage-v">
            <div th:replace="admin/vouchers_section :: vouchers"></div>
        </div>

        <div class="tab-pane fade" id="tab-manage-u">
            <div th:replace="admin/users_section :: users"></div>
        </div>

        <div class="tab-pane fade" id="tab-create-v" sec:authorize="hasAuthority('voucher:create')">
            <div th:replace="admin/vouchers_section :: create-voucher-form"></div>
        </div>

        <div class="tab-pane fade" id="tab-create-u" sec:authorize="hasAuthority('user:create')">
            <div th:replace="admin/users_section :: create-user-form"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let currentVouchers = [];
    let currentUsers = [];
    let vSort = { field: 'id', dir: 'asc' };

    // Получаем права из атрибутов body
    const canDeleteV = document.body.getAttribute('data-can-delete-v') === 'true';
    const canDeleteU = document.body.getAttribute('data-can-delete-u') === 'true';

    document.addEventListener("DOMContentLoaded", () => {
        loadVouchers();
        loadUsers();
    });


    function loadVouchers() {
        fetch(`/api/vouchers?size=100&status=ALL&sort=${vSort.field},${vSort.dir}`)
            .then(res => res.json())
            .then(data => {
                currentVouchers = data.vouchers || [];
                renderVouchers();
            });
    }

    function sortVouchers(field) {
        vSort.dir = (vSort.field === field && vSort.dir === 'asc') ? 'desc' : 'asc';
        vSort.field = field;
        loadVouchers();
    }

    function renderVouchers() {
        const list = document.getElementById('admin-vouchers-list');
        if (!list) return;

        list.innerHTML = currentVouchers.map(v => {
            const isHot = v.hot === true || String(v.hot) === 'true';

            return `
                <tr>
                    <td class="fw-bold">${v.title}</td>
                    <td><span class="badge bg-light text-dark border">${v.tourType}</span></td>
                    <td>$${v.price.toFixed(2)}</td>
                    <td><span class="badge bg-info text-dark">${v.status}</span></td>
                    <td>
                        <button class="btn btn-sm ${isHot ? 'btn-danger' : 'btn-outline-secondary'} me-1"
                                onclick="toggleHotStatus('${v.id}')">
                            <i class="bi bi-fire"></i> ${isHot ? 'HOT' : 'OFF'}
                        </button>
                        <button class="btn btn-sm btn-warning" onclick="openEditVoucher('${v.id}')">Edit</button>
                        ${canDeleteV ? `<button class="btn btn-sm btn-danger ms-1" onclick="deleteVoucher('${v.id}')">Del</button>` : ''}
                    </td>
                </tr>`;
        }).join('');
    }

    async function toggleHotStatus(id) {
        const v = currentVouchers.find(item => item.id === id);
        if (!v) return;

        const nextStatus = !v.hot;

        const res = await fetch(`/api/vouchers/${id}/status`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ hot: nextStatus })
        });

        if (res.ok) {
            v.hot = nextStatus;
            renderVouchers();
        } else {
            alert('Failed to update hot status');
        }
    }

    function deleteVoucher(id) {
        if (confirm('Are you sure you want to delete this voucher?')) {
            fetch(`/api/vouchers/${id}`, { method: 'DELETE' })
                .then(res => res.ok ? loadVouchers() : alert('Delete failed'));
        }
    }


    function loadUsers() {
        fetch('/api/users')
            .then(res => res.json())
            .then(users => {
                currentUsers = users || [];
                renderUsers();
            });
    }

    function renderUsers() {
        const list = document.getElementById('admin-users-list');
        if (!list) return;

        list.innerHTML = currentUsers.map(u => `
            <tr>
                <td>${u.username}</td>
                <td>${u.role}</td>
                <td>
                    <span class="badge ${u.active ? 'bg-success' : 'bg-danger'}">
                        ${u.active ? 'Active' : 'Passive'}
                    </span>
                </td>
                <td class="text-success fw-bold">$${(u.balance || 0).toFixed(2)}</td>
                <td>
                    <button class="btn btn-sm btn-warning" onclick="openEditUser('${u.id}')">Edit</button>
                    ${canDeleteU ? `<button class="btn btn-sm btn-danger ms-1" onclick="deleteUser('${u.id}')">Del</button>` : ''}
                </td>
            </tr>`).join('');
    }

    function deleteUser(id) {
        if (confirm('Are you sure you want to delete this user?')) {
            fetch(`/api/users/${id}`, { method: 'DELETE' })
                .then(res => res.ok ? loadUsers() : alert('Delete failed'));
        }
    }

    document.getElementById('v-form')?.addEventListener('submit', async e => {
        e.preventDefault();
        const data = {
            title: document.getElementById('v-title').value,
            description: document.getElementById('v-desc').value,
            price: parseFloat(document.getElementById('v-price').value),
            tourType: document.getElementById('v-tourType').value,
            status: document.getElementById('v-status').value,
            hot: document.getElementById('v-hot').value === 'true',
            transferType: document.getElementById('v-transfer').value,
            hotelType: document.getElementById('v-hotel').value
        };

        const res = await fetch('/api/vouchers', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        if (res.ok) {
            location.reload();
        } else {
            alert('Failed to create voucher');
        }
    });

    document.getElementById('u-form')?.addEventListener('submit', async e => {
        e.preventDefault();
        const data = {
            username: document.getElementById('u-username').value,
            password: document.getElementById('u-password').value,
            phoneNumber: document.getElementById('u-phone').value,
            role: document.getElementById('u-role').value,
            balance: parseFloat(document.getElementById('u-balance').value),
            active: document.getElementById('u-active').value === 'true'
        };

        const res = await fetch('/api/users', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        if (res.ok) {
            location.reload();
        } else {
            alert('Failed to create user');
        }
    });


    function openEditVoucher(id) {
        const v = currentVouchers.find(i => i.id === id);
        if (!v) return;
        document.getElementById('edit-v-id').value = v.id;
        document.getElementById('edit-v-title').value = v.title || '';
        document.getElementById('edit-v-desc').value = v.description || '';
        document.getElementById('edit-v-price').value = v.price || 0;
        document.getElementById('edit-v-status').value = v.status || 'REGISTERED';
        document.getElementById('edit-v-tourType').value = v.tourType;
        document.getElementById('edit-v-transfer').value = v.transferType;
        document.getElementById('edit-v-hotel').value = v.hotelType;
        new bootstrap.Modal(document.getElementById('editVoucherModal')).show();
    }

    async function saveVoucherChanges() {
        const id = document.getElementById('edit-v-id').value;
        const data = {
            title: document.getElementById('edit-v-title').value,
            description: document.getElementById('edit-v-desc').value,
            price: parseFloat(document.getElementById('edit-v-price').value),
            status: document.getElementById('edit-v-status').value,
            tourType: document.getElementById('edit-v-tourType').value,
            transferType: document.getElementById('edit-v-transfer').value,
            hotelType: document.getElementById('edit-v-hotel').value
        };
        const res = await fetch(`/api/vouchers/${id}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        if (res.ok) location.reload();
        else alert('Update failed');
    }

    function openEditUser(id) {
        const u = currentUsers.find(i => i.id === id);
        if (!u) return;
        document.getElementById('edit-u-id').value = u.id;
        document.getElementById('edit-u-original-username').value = u.username;
        document.getElementById('edit-u-username').value = u.username;
        document.getElementById('edit-u-phone').value = u.phoneNumber || '';
        document.getElementById('edit-u-balance').value = u.balance || 0;
        document.getElementById('edit-u-active').value = String(u.active);

        const roleSelect = document.getElementById('edit-u-role');
        if (roleSelect) roleSelect.value = u.role.replace('ROLE_', '');

        new bootstrap.Modal(document.getElementById('editUserModal')).show();
    }

    async function saveUserChanges() {
        const username = document.getElementById('edit-u-original-username').value;
        const data = {
            username: document.getElementById('edit-u-username').value,
            phoneNumber: document.getElementById('edit-u-phone').value,
            balance: parseFloat(document.getElementById('edit-u-balance').value),
            active: document.getElementById('edit-u-active').value === 'true',
            role: document.getElementById('edit-u-role')?.value || 'USER'
        };

        const res = await fetch(`/api/users/${username}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        if (res.ok) location.reload();
        else alert('User update failed');
    }
</script>
</body>
</html>
