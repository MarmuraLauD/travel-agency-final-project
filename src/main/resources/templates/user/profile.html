<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Travel Agency | My Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: header}"></div>

<div class="container mt-5">
    <div class="row">
        <div class="col-lg-4 mb-4">
            <div class="card shadow-sm border-0">
                <div class="card-body text-center p-4">
                    <i class="bi bi-person-circle text-primary" style="font-size: 4rem;"></i>
                    <h3 class="mt-3" id="prof-username">Loading...</h3>
                    <p class="text-muted" id="prof-phone"></p>
                    <div class="d-grid mt-3">
                        <div class="p-3 bg-light rounded border">
                            <small class="text-uppercase fw-bold text-muted d-block mb-1">My Balance</small>
                            <span class="h4 fw-bold text-success" id="prof-balance">$0.00</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3">
                    <h5 class="mb-0 fw-bold">My Booked Tours</h5>
                </div>
                <div class="card-body">
                    <div id="vouchers-list" class="row g-3"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", loadProfile);

    async function loadProfile() {
        try {
            const res = await fetch('/api/users/me');
            if (!res.ok) throw new Error();
            const user = await res.json();

            document.getElementById('prof-username').innerText = user.username;
            document.getElementById('prof-phone').innerText = user.phoneNumber || 'No phone provided';
            document.getElementById('prof-balance').innerText = `$${user.balance.toFixed(2)}`;

            renderVouchers(user.vouchers);
        } catch (err) {
            window.location.href = '/login';
        }
    }

    function renderVouchers(vouchers) {
        const list = document.getElementById('vouchers-list');
        if (!vouchers || vouchers.length === 0) {
            list.innerHTML = '<p class="text-center text-muted py-4">You haven\'t booked any tours yet.</p>';
            return;
        }

        list.innerHTML = vouchers.map(v => `
            <div class="col-12">
                <div class="card border-0 bg-light p-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h6 class="fw-bold mb-1">${v.title}</h6>
                            <div class="small text-muted">
                                <span><i class="bi bi-calendar3"></i> ${v.arrivalDate}</span>
                                <span class="ms-2 badge bg-white text-dark border">${v.tourType}</span>
                            </div>
                        </div>
                        <div class="text-end">
                            <div class="fw-bold text-primary mb-2">$${v.price.toFixed(2)}</div>
                            <button class="btn btn-sm btn-outline-danger rounded-pill"
                                    onclick="cancelBooking('${v.id}')">
                                Cancel Tour
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        `).join('');
    }

    async function cancelBooking(voucherId) {
        if (!confirm('Are you sure you want to cancel this booking? The money will be returned to your balance.')) return;

        try {
            const res = await fetch(`/api/vouchers/${voucherId}/cancel`, {
                method: 'POST'
            });

            if (res.ok) {
                await loadProfile();
            } else {
                alert('Cancellation failed');
            }
        } catch (err) {
            alert('Network error');
        }
    }
</script>
</body>
</html>
