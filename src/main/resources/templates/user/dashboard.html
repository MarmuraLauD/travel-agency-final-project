<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <title>Travel Agency | Dashboard</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" th:href="@{/}">Travel Agency</a>
    <div class="d-flex">
      <span class="navbar-text text-white">Welcome to your Dashboard!</span>
    </div>
  </div>
</nav>

<div class="container">
  <h2 class="mb-4">Available Tours</h2>

  <table class="table table-bordered table-hover">
    <thead class="thead-light">
    <tr>
      <th scope="col">ID</th>
      <th scope="col">Voucher Title</th>
      <th scope="col">Description</th>
      <th scope="col">Price</th>
      <th scope="col">Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="voucher : ${vouchers}">
      <td th:text="${voucher.id}"></td>
      <td th:text="${voucher.title}"></td>
      <td th:text="${voucher.description}"></td>
      <td th:text="${voucher.price} + ' $'"></td>
      <td>
        <button class="btn btn-outline-success btn-sm">Order</button>
      </td>
    </tr>
    <tr th:if="${#lists.isEmpty(vouchers)}">
      <td colspan="5" class="text-center">No vouchers available right now.</td>
    </tr>
    </tbody>
  </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
