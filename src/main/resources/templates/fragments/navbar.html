<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<div th:fragment="header">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}">🌍 Travel Agency</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link text-info" th:href="@{/dashboard}">Tours Dashboard</a>
                    </li>
                    <li class="nav-item" sec:authorize="isAuthenticated()">
                        <a class="nav-link text-warning fw-bold" th:href="@{/profile}">My Profile</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasAnyAuthority('voucher:create', 'voucher:update')">
                        <a class="nav-link text-danger fw-bold" th:href="@{/admin}">
                            <i class="bi bi-shield-lock-fill"></i> Admin Panel
                        </a>
                    </li>
                </ul>

                <div class="d-flex align-items-center">
                    <div sec:authorize="isAnonymous()">
                        <a th:href="@{/login}" class="btn btn-outline-light btn-sm me-2">Sign In</a>
                        <a th:href="@{/register}" class="btn btn-warning btn-sm">Sign Up</a>
                    </div>
                    <div sec:authorize="isAuthenticated()" class="text-white d-flex align-items-center">
                        <span class="me-3">Hi, <b sec:authentication="name">User</b></span>
                        <button id="globalLogoutBtn" class="btn btn-danger btn-sm">Logout</button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <script>
        let isRefreshing = false;
        let refreshSubscribers = [];

        function subscribeTokenRefresh(cb) {
            refreshSubscribers.push(cb);
        }

        function onRefreshed(success) {
            refreshSubscribers.forEach(cb => cb(success));
            refreshSubscribers = [];
        }

        async function apiFetch(url, options = {}) {
            const response = await fetch(url, options);

            if (response.status !== 401) {
                return response;
            }
            console.log("Token expired, attempting refresh...");
            if (!isRefreshing) {
                isRefreshing = true;

                let refreshOk = false;
                try {
                    const refreshRes = await fetch('/api/auth/refresh', { method: 'POST' });
                    refreshOk = refreshRes.ok;
                } catch (err) {
                    refreshOk = false;
                }

                isRefreshing = false;

                if (refreshOk) {
                    onRefreshed(true);
                    return await fetch(url, options);
                } else {
                    onRefreshed(false);
                    fetch('/api/auth/logout', { method: 'DELETE' }).finally(() => {
                        window.location.href = '/login?expired=true';
                    });
                    return response;
                }
            }

            return new Promise((resolve, reject) => {
                subscribeTokenRefresh(async (success) => {
                    if (success) {
                        resolve(await fetch(url, options));
                    } else {
                        reject(new Error('Session expired'));
                    }
                });
            });
        }

        const logoutBtn = document.getElementById('globalLogoutBtn');
        if (logoutBtn) {
            logoutBtn.addEventListener('click', function () {
                fetch('/api/auth/logout', { method: 'DELETE' })
                    .then(() => { window.location.href = '/login'; })
                    .catch(err => console.error('Logout failed', err));
            });
        }
    </script>
</div>
</html>
